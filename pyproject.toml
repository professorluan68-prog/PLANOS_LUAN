[tool.black]
line-length = 88
target-version = ['py311']  # Ajuste para sua versão do Python
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true

[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203",  # Compatibilidade com Black
    "W503"   # Compatibilidade com Black
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv"
]
