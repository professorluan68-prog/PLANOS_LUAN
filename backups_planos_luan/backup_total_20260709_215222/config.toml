# Linguagem padrão para sugestões
default_language = "python"

# Estilo de indentação (PEP 8 recomenda 4 espaços)
indent_style = "space"
indent_size = 4

# Limitar sugestões a código seguro
allow_unsafe_code = false

# Configurações de formatação automática
[formatting]
line_length = 88          # Compatível com Black
trim_trailing_whitespace = true
insert_final_newline = true

# Configurações de execução
[execution]
allow_managed_hooks_only = true  # Bloqueia hooks não gerenciados
timeout_seconds = 5              # Evita loops infinitos

# Configurações de rede (opcional)
[network]
use_proxy = false
proxy = ""                        # Ex.: "http://usuario:senha@proxy.exemplo.com:8080"

# Preferências de sugestão
[suggestions]
max_suggestions = 3               # Número máximo de alternativas
prefer_docstrings = true          # Incentiva docstrings no estilo PEP 257
