name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-ci.txt
      - name: Lint
        run: |
          # Run lint on the new/modified resilience files
          black --check core/cache_manager.py core/ia_client.py core/engine.py tests/unit/
          flake8 core/cache_manager.py core/ia_client.py core/engine.py tests/unit/
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests -q
      - name: Smoke test (small)
        run: bash scripts/run_smoke.sh
