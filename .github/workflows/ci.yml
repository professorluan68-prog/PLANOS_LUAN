name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Lint
        run: |
          pip install black flake8
          # Run lint on the new/modified resilience files
          black --check core/cache_manager.py core/ia_client.py core/engine.py tests/unit/
          flake8 core/cache_manager.py core/ia_client.py core/engine.py tests/unit/
      - name: Run unit tests
        run: pytest tests/unit -q
      - name: Smoke test (small)
        run: bash scripts/run_smoke.sh
